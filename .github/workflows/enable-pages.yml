name: enable-pages
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  pages: write
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable legacy GitHub Pages from main /
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          repo="${{ github.repository }}"
          body='{"build_type":"legacy","source":{"branch":"main","path":"/"}}'
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${repo}/pages" \
            -d "$body")
          echo "create_status=$code"
          cat /tmp/pages.json
          echo
          if [ "$code" = "201" ] || [ "$code" = "200" ] || [ "$code" = "409" ]; then
            exit 0
          fi
          if [ "$code" = "422" ]; then
            code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${repo}/pages" \
              -d "$body")
            echo "update_status=$code"
            cat /tmp/pages.json
            echo
            if [ "$code" = "200" ] || [ "$code" = "204" ]; then
              exit 0
            fi
          fi
          exit 1
